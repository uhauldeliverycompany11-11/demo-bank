<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard Panel</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0d0d0d;
    color: #fff;
}

header {
    background: #111;
    padding: 15px;
    text-align: center;
    font-size: 24px;
    color: #ff3c3c;
    letter-spacing: 2px;
}

nav {
    display: flex;
    background: #1a1a1a;
    padding: 10px;
    gap: 10px;
    justify-content: center;
}

nav a {
    color: #fff;
    text-decoration: none;
    padding: 8px 15px;
    background: #222;
    border-radius: 5px;
}

nav a:hover {
    background: #ff3c3c;
}

.container {
    display: flex;
}

.sidebar {
    width: 250px;
    background: #111;
    padding: 15px;
}

.sidebar h3 {
    border-bottom: 1px solid #333;
    padding-bottom: 5px;
}

.main {
    flex: 1;
    padding: 20px;
}

.table {
    width: 100%;
    border-collapse: collapse;
}

.table th, .table td {
    padding: 10px;
    border-bottom: 1px solid #333;
}

.table th {
    background: #1a1a1a;
}

.btn {
    background: #ff3c3c;
    padding: 5px 10px;
    border: none;
    color: white;
    cursor: pointer;
    border-radius: 4px;
}

.btn:hover {
    background: #ff1a1a;
}
</style>
</head>

<body>

<header>MY DASHBOARD</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Tools</a>
    <a href="#">Links</a>
    <a href="#">Settings</a>
</nav>

<div class="container">

    <div class="sidebar">
        <h3>User Info</h3>
        <p>Username: Admin</p>
        <p>Status: Active</p>

        <h3>Menu</h3>
        <p>• Dashboard</p>
        <p>• Analytics</p>
        <p>• Resources</p>
    </div>

    <div class="main">
        <h2>Resource Links</h2>

        <table class="table">
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Link</th>
                <th>Action</th>
            </tr>

            <tr>
                <td>1</td>
                <td>Google</td>
                <td><a href="https://google.com" target="_blank">Visit</a></td>
                <td><button class="btn">Open</button></td>
            </tr>

            <tr>
                <td>2</td>
                <td>YouTube</td>
                <td><a href="https://youtube.com" target="_blank">Visit</a></td>
                <td><button class="btn">Open</button></td>
            </tr>

            <tr>
                <td>3</td>
                <td>GitHub</td>
                <td><a href="https://github.com" target="_blank">Visit</a></td>
                <td><button class="btn">Open</button></td>
            </tr>

        </table>
    </div>

</div>

</body>
</html>
